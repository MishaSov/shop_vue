name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # или master, если ваша основная ветка называется так

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает права на запись в репозиторий

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist